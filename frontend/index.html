<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess App</title>
    <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Chess</h1>
        </header>
        
        <main>
            <div id="game-container">
                <div id="board" aria-label="Chess board"></div>
                
                <aside id="game-info">
                    <div id="turn-indicator">Loading game…</div>
                    <div id="game-status" role="status" aria-live="polite"></div>
                    <div id="captured-pieces">
                        <p>Your captures <small>(Black pieces)</small></p>
                        <div id="captured-by-white" aria-label="Black pieces captured by you">None</div>
                        <p>Computer captures <small>(White pieces)</small></p>
                        <div id="captured-by-black" aria-label="White pieces captured by computer">None</div>
                    </div>
                    <button id="retry-ai" hidden>Retry computer move</button>
                </aside>
            </div>
            
            <div id="controls">
                <button id="new-game">New Game</button>
                <button id="undo">Undo</button>
                <button id="redo">Redo</button>
                <button id="flip-board">Flip Board</button>
            </div>
            
            <section id="move-history" aria-labelledby="move-history-title">
                <h2 id="move-history-title">Move history</h2>
                <ol id="move-list"></ol>
            </section>
        </main>
        <dialog id="promotion-dialog" aria-labelledby="promotion-title">
            <h2 id="promotion-title">Promote your pawn</h2>
            <p>Choose a piece:</p>
            <div class="promotion-options">
                <button type="button" value="queen">Queen ♕</button>
                <button type="button" value="rook">Rook ♖</button>
                <button type="button" value="bishop">Bishop ♗</button>
                <button type="button" value="knight">Knight ♘</button>
            </div>
            <button type="button" id="cancel-promotion">Cancel</button>
        </dialog>
    </div>
    
    <script type="module" src="./src/index.ts"></script>
</body>
</html>
